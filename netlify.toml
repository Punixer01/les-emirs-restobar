[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty routes for the two protected apps
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/reception"
  to = "/reception.html"
  status = 200
[[redirects]]
  from = "/carte"
  to = "/carte.html"
  status = 200
[[redirects]]
  from = "/modifier"
  to = "/modifier.html"
  status = 200
[[redirects]]
  from = "/maison"
  to = "/maison.html"
  status = 200
[[redirects]]
  from = "/galerie"
  to = "/galerie.html"
  status = 200
[[redirects]]
  from = "/signature"
  to = "/signature.html"
  status = 200
[[redirects]]
  from = "/reserver"
  to = "/reserver.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# API → functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
