<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Les Émirs — Bienvenue</title>
<meta name="description" content="Restaurant Les Émirs, Port El Kantaoui : la carte, nos avis Google, nos réseaux et notre site." />
<meta name="theme-color" content="#0c110e" />
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --night:#0c110e; --marine:#1f473f; --bone:#f3efe6; --gold:#c2a463; --gold-d:#a98c4b;
  --line:rgba(243,239,230,.18); --soft:rgba(243,239,230,.7);
  --serif:"Fraunces","Times New Roman",serif; --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  min-height:100svh;-webkit-tap-highlight-color:transparent}

/* the room behind: the terrace film (or its still), slow and dim */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg img,.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%}
.bg img{animation:drift 26s ease-in-out infinite alternate}
.bg video{opacity:0;transition:opacity 2.4s ease}
.bg video.on{opacity:1}
@keyframes drift{from{transform:scale(1.06)}to{transform:scale(1.14) translateY(-1.5%)}}
.bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 70% at 50% 18%,rgba(12,17,14,.35),rgba(12,17,14,.78) 60%,rgba(12,17,14,.95)),
             linear-gradient(180deg,rgba(12,17,14,.55),rgba(12,17,14,.2) 35%,rgba(12,17,14,.9))}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

.lang{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:5;display:flex;gap:2px;
  border:1px solid var(--line);border-radius:100px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  background:rgba(12,17,14,.35);opacity:0;animation:fade 1s var(--ease) 2.6s forwards}
.lang button{font:600 10.5px/1 var(--sans);letter-spacing:.12em;padding:7px 10px;border-radius:100px;border:0;background:none;color:var(--soft);cursor:pointer}
.lang button.on{background:var(--bone);color:var(--night)}

main{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  padding:calc(64px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto}

/* intro: a gold line draws, the logo comes into focus, then everything settles up */
.mark{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:14vh;
  transition:margin-top 1.3s var(--ease)}
body.ready .mark{margin-top:0}
.rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:rule 1.1s var(--ease) .2s forwards}
@keyframes rule{to{width:120px}}
.logo{width:min(190px,46vw);height:auto;margin:18px 0 4px;opacity:0;filter:blur(12px) drop-shadow(0 10px 30px rgba(0,0,0,.5));
  transform:scale(.97);animation:logo 1.5s var(--ease) .55s forwards;-webkit-user-drag:none;user-select:none}
@keyframes logo{to{opacity:1;filter:blur(0) drop-shadow(0 10px 30px rgba(0,0,0,.5));transform:none}}
.since{font:italic 300 15px/1.4 var(--serif);color:var(--gold);letter-spacing:.04em;opacity:0;animation:fade 1s var(--ease) 1.25s forwards}
.welcome{margin-top:6px;font:400 10.5px/1.6 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--soft);
  opacity:0;animation:fade 1s var(--ease) 1.45s forwards}
.rule--b{margin-top:16px;animation-delay:1.3s}
@keyframes fade{to{opacity:1}}

/* the four doors */
.doors{width:100%;display:grid;gap:10px;margin-top:26px}
.door{position:relative;display:flex;align-items:center;gap:16px;width:100%;padding:18px 18px 18px 16px;border-radius:16px;
  border:1px solid var(--line);background:rgba(18,25,21,.48);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
  color:var(--bone);text-decoration:none;text-align:left;font:inherit;cursor:pointer;
  opacity:0;transform:translateY(16px);transition:transform .5s var(--ease),border-color .3s,background .3s}
body.ready .door{animation:door .9s var(--ease) forwards}
body.ready .door:nth-child(1){animation-delay:.05s} body.ready .door:nth-child(2){animation-delay:.16s}
body.ready .door:nth-child(3){animation-delay:.27s} body.ready .door:nth-child(4){animation-delay:.38s}
body.ready .door:nth-child(5){animation-delay:.49s} body.ready .doors>div .door{animation-delay:.49s}
@keyframes door{to{opacity:1;transform:none}}
.door:active{transform:scale(.985)}
.door:hover{border-color:rgba(194,164,99,.55)}
.door--main{background:var(--bone);color:var(--night);border-color:var(--bone)}
.door--main .door__sub{color:#5d564a}
.door--main .door__ico{background:var(--marine);color:var(--bone);border-color:var(--marine)}
.door__ico{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(194,164,99,.5);color:var(--gold)}
.door__ico svg{width:20px;height:20px}
.door__txt{flex:1 1 auto;min-width:0}
.door__t{display:block;font:400 21px/1.15 var(--serif);letter-spacing:-.005em}
.door__sub{display:block;margin-top:4px;font:500 10.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.stars{color:var(--gold);letter-spacing:2px;font-size:12px;margin-right:6px}
.door__arr{flex:0 0 auto;opacity:.55;font-size:18px;transition:transform .3s var(--ease)}
.door[aria-expanded="true"] .door__arr{transform:rotate(90deg)}

/* social: opens under its door */
.social{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.social.open{grid-template-rows:1fr}
.social>div{overflow:hidden;display:grid;gap:8px}
.social.open>div{padding-top:2px}
.soc{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:13px;border:1px solid var(--line);
  background:rgba(18,25,21,.4);color:var(--bone);text-decoration:none;font-size:14px}
.soc svg{width:19px;height:19px;color:var(--gold);flex:0 0 auto}
.soc b{font-weight:500}
.soc span{color:var(--soft);font-size:12.5px;margin-left:auto}

footer{margin-top:auto;padding-top:34px;text-align:center;font-size:11.5px;letter-spacing:.06em;color:rgba(243,239,230,.5);line-height:1.8;
  opacity:0;transition:opacity 1s ease .6s}
body.ready footer{opacity:1}
footer a{color:inherit}

.skip{position:fixed;inset:0;z-index:3;background:none;border:0;cursor:pointer}
body.ready .skip{display:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <img src="/assets/media/hero-poster-v3.jpg" alt="" />
  <video id="bgv" muted loop playsinline preload="none"></video>
</div>
<div class="grain" aria-hidden="true"></div>
<button class="skip" id="skip" aria-label="Passer l'introduction"></button>

<div class="lang" role="group" aria-label="Langue">
  <button type="button" data-l="fr" class="on">FR</button><button type="button" data-l="en">EN</button>
</div>

<main>
  <div class="mark">
    <div class="rule"></div>
    <img class="logo" src="/assets/logo-cream.png" alt="Restaurant Les Émirs — Port El Kantaoui" draggable="false" />
    <div class="rule rule--b"></div>
  </div>

  <nav class="doors" aria-label="Les Émirs">
    <a class="door door--main" href="/?carte=1" data-go="menu">
      <span class="door__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/><path d="M6.5 8h2.5M6.5 11h2.5M15 8h2.5M15 11h2.5"/></svg></span>
      <span class="door__txt"><span class="door__t" data-t="menu">La Carte</span><span class="door__sub" data-t="menuSub">Plats, spécialités &amp; prix</span></span>
      <span class="door__arr" aria-hidden="true">›</span>
    </a>
    <a class="door" id="reviewLink" href="#" target="_blank" rel="noopener" data-go="review">
      <span class="door__ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.6l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg></span>
      <span class="door__txt"><span class="door__t" data-t="review">Votre avis</span><span class="door__sub"><span class="stars">★★★★★</span><span data-t="reviewSub">sur Google</span></span></span>
      <span class="door__arr" aria-hidden="true">›</span>
    </a>
    <a class="door" href="/reclamation" data-go="reclamation">
      <span class="door__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 17H10l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 5z"/><path d="M12 8.5v3.5M12 14.6v.01"/></svg></span>
      <span class="door__txt"><span class="door__t" data-t="claim">Réclamation</span><span class="door__sub" data-t="claimSub">Un souci ? Écrivez-nous</span></span>
      <span class="door__arr" aria-hidden="true">›</span>
    </a>
    <a class="door" href="/" data-go="site" id="siteDoor">
      <span class="door__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.5 3.6 5.3 3.6 8.5S14.4 18 12 20.5C9.6 18 8.4 15.2 8.4 12S9.6 6 12 3.5z"/></svg></span>
      <span class="door__txt"><span class="door__t" data-t="site">Notre site web</span><span class="door__sub" data-t="siteSub">Réservation, galerie &amp; contact</span></span>
      <span class="door__arr" aria-hidden="true">›</span>
    </a>
    <div>
      <button type="button" class="door" id="socialBtn" aria-expanded="false" aria-controls="social" data-go="social" style="width:100%">
        <span class="door__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor"/></svg></span>
        <span class="door__txt"><span class="door__t" data-t="social">Réseaux sociaux</span><span class="door__sub" data-t="socialSub">Instagram &amp; Facebook</span></span>
        <span class="door__arr" aria-hidden="true">›</span>
      </button>
      <div class="social" id="social"><div>
        <a class="soc" id="igLink" href="https://www.instagram.com/les_emirs_restaurant/" target="_blank" rel="noopener" data-go="instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor"/></svg>
          <b>Instagram</b><span>@les_emirs_restaurant</span></a>
        <a class="soc" id="fbLink" href="https://www.facebook.com/restaurantlesemirs/" target="_blank" rel="noopener" data-go="facebook">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H8v3h2.5V21z"/></svg>
          <b>Facebook</b><span>Restaurant Les Émirs</span></a>
      </div></div>
    </div>
  </nav>

  <footer>
    Port El Kantaoui · Sousse<br>
    <a href="tel:+21673348700">+216 73 348 700</a>
  </footer>
</main>

<script>
(function(){
  /* ---- the Google review door: the restaurant's own "write a review" link ---- */
  var GOOGLE_REVIEW = "https://g.page/r/CSXxboIe0TjsEBE/review";
  document.getElementById("reviewLink").href = GOOGLE_REVIEW;

  /* ---- words, in the guest's language ---- */
  var T = {
    fr:{menu:"La Carte", menuSub:"Plats, spécialités & prix", review:"Votre avis", reviewSub:"sur Google",
        claim:"Réclamation", claimSub:"Un souci ? Écrivez-nous", site:"Notre site web", siteSub:"Réservation, galerie & contact",
        social:"Réseaux sociaux", socialSub:"Instagram & Facebook", skip:"Passer l'introduction"},
    en:{menu:"The Menu", menuSub:"Dishes, specialities & prices", review:"Your review", reviewSub:"on Google",
        claim:"Complaint", claimSub:"Something wrong? Write to us", site:"Our website", siteSub:"Booking, gallery & contact",
        social:"Social media", socialSub:"Instagram & Facebook", skip:"Skip the intro"}
  };
  var lang;
  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll("[data-t]").forEach(function(el){ var v=T[l][el.getAttribute("data-t")]; if(v) el.textContent=v; });
    document.getElementById("skip").setAttribute("aria-label", T[l].skip);
    document.querySelectorAll(".lang [data-l]").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-l")===l); });
    /* the menu opens in the same language (the site remembers it per phone) */
    try{ localStorage.setItem("emirs_menu_lang", l); }catch(e){}
  }
  var saved=null; try{ saved=localStorage.getItem("emirs_menu_lang"); }catch(e){}
  setLang(saved==="en" ? "en" : "fr");          // French unless the guest picked EN
  document.querySelector(".lang").addEventListener("click", function(e){ var b=e.target.closest("[data-l]"); if(b) setLang(b.getAttribute("data-l")); });

  /* ---- intro, then the four doors (a tap skips it) ---- */
  var done=false;
  function ready(){ if(done) return; done=true; document.body.classList.add("ready"); }
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(ready, reduce ? 0 : 1700);
  document.getElementById("skip").addEventListener("click", ready);

  /* ---- social opens in place ---- */
  var sb=document.getElementById("socialBtn"), so=document.getElementById("social");
  sb.addEventListener("click", function(){ var o=sb.getAttribute("aria-expanded")!=="true"; sb.setAttribute("aria-expanded", String(o)); so.classList.toggle("open", o); });

  /* ---- the terrace film, only on a connection that can afford it ---- */
  var c=navigator.connection||{};
  if(!reduce && !c.saveData && !/(^|-)2g$/.test(c.effectiveType||"")){
    var v=document.getElementById("bgv");
    v.src="/assets/media/hero-v3.mp4";
    v.addEventListener("canplay", function(){ v.classList.add("on"); var p=v.play(); if(p&&p.catch) p.catch(function(){}); }, {once:true});
    v.load();
  }

  /* ---- what guests tap, for the owner's Analytics ---- */
  function track(type, meta){
    try{ var body=JSON.stringify({type:type, path:"/qr", meta:Object.assign({lang:lang}, meta||{})});
      if(navigator.sendBeacon) navigator.sendBeacon("/api/track", new Blob([body],{type:"application/json"}));
      else fetch("/api/track",{method:"POST",headers:{"content-type":"application/json"},body:body,keepalive:true});
    }catch(e){}
  }
  track("qr_open");
  document.querySelectorAll("[data-go]").forEach(function(a){ a.addEventListener("click", function(){ track("qr_click",{to:a.getAttribute("data-go")}); }); });

  /* the owner's own links, if he changed them in his dashboard */
  fetch("/api/content").then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    var c=d&&d.content||{};
    if(c.facebook) document.getElementById("fbLink").href=c.facebook;
    if(c.instagram) document.getElementById("igLink").href=c.instagram;
    if(c.google_review) document.getElementById("reviewLink").href=c.google_review;
  }).catch(function(){});
})();
</script>
</body>
</html>
