<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Page introuvable — Les Émirs</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0c110e" />
<link rel="icon" href="/assets/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--night:#0c110e;--bone:#f3efe6;--gold:#c2a463;--soft:rgba(243,239,230,.7);--line:rgba(243,239,230,.22)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 22px;
  background:radial-gradient(120% 80% at 50% 0%,#1f473f 0%,#13221e 55%,var(--night) 100%);color:var(--bone);
  font-family:"Inter",-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:440px}
img{width:min(220px,60vw);height:auto}
.rule{width:110px;height:1px;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1{font:400 clamp(26px,6vw,34px)/1.15 "Fraunces","Times New Roman",serif}
h1 i{color:var(--gold);font-weight:300}
p{margin-top:12px;color:var(--soft);font-size:15px;line-height:1.6}
.go{display:grid;gap:10px;margin-top:28px}
a.b{display:block;padding:15px 18px;border-radius:14px;border:1px solid var(--line);color:var(--bone);text-decoration:none;font-size:14px;letter-spacing:.04em}
a.b.main{background:var(--bone);color:var(--night);border-color:var(--bone);font-weight:500}
a.b:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-cream.png" alt="Restaurant Les Émirs — Port El Kantaoui" />
  <div class="rule"></div>
  <h1>Cette page n'existe <i>pas</i>.</h1>
  <p>Le lien est peut-être ancien ou mal recopié. Voici où trouver ce que vous cherchez.</p>
  <div class="go">
    <a class="b main" href="/#reserver">Réserver une table</a>
    <a class="b" href="/?carte=1">Voir la carte</a>
    <a class="b" href="/">Accueil du site</a>
  </div>
</main>
</body>
</html>
