<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Paiement — Restaurant Les Émirs</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="only light" />
<meta name="theme-color" content="#f3efe6" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--bone:#f3efe6;--ink:#17150f;--stone:#726a5c;--marine:#1f473f;--gold:#a98c4b;--rust:#a4552f}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bone);color:var(--ink);
  font:16px/1.7 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px}
.card{width:100%;max-width:440px;text-align:center}
.logo{width:150px;height:auto;margin:0 auto 26px;display:block}
.mark{width:58px;height:58px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:26px;color:#fff;background:var(--marine)}
.mark.ko{background:var(--rust)}
h1{font:300 clamp(1.7rem,6vw,2.2rem)/1.2 "Fraunces",Georgia,serif;margin:0 0 10px}
p{margin:0 auto 24px;color:var(--stone);max-width:30rem}
a.btn{display:inline-block;background:var(--marine);color:var(--bone);text-decoration:none;border-radius:100px;padding:13px 26px;
  font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/assets/logo-ink.png" alt="Restaurant Les Émirs" />
  <div class="mark" id="mark">✓</div>
  <h1 id="t">—</h1>
  <p id="p"></p>
  <a class="btn" id="b" href="/">Retour au site</a>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search), s=q.get("s")||"ko", k=q.get("k")||"";
  var en=false; try{ en=localStorage.getItem("emirs_lang")==="en"||localStorage.getItem("emirs_menu_lang")==="en"; }catch(e){}
  var T={
    fr:{ok:["Paiement reçu", k==="credit"?"Merci, votre règlement a bien été enregistré sur votre compte.":"Merci, votre acompte est enregistré. Notre équipe confirme votre réservation par email."],
        ko:["Paiement non abouti","Le paiement n’a pas été effectué. Vous pouvez réessayer depuis le lien reçu par email, ou nous appeler au +216 73 348 700."],
        done:["Déjà réglé","Ce montant a déjà été payé. Merci&nbsp;!"],
        closed:["Réservation clôturée","Cette réservation n’est plus active : aucun paiement n’est nécessaire."],
        off:["Paiement en ligne indisponible","Le paiement en ligne n’est pas encore ouvert. Merci de régler sur place ou de nous appeler au +216 73 348 700."],
        back:"Retour au site"},
    en:{ok:["Payment received", k==="credit"?"Thank you, your payment has been recorded on your account.":"Thank you, your deposit is recorded. Our team will confirm your booking by email."],
        ko:["Payment not completed","The payment did not go through. You can try again from the link in your email, or call us on +216 73 348 700."],
        done:["Already paid","This amount has already been paid. Thank you!"],
        closed:["Booking closed","This booking is no longer active: no payment is needed."],
        off:["Online payment unavailable","Online payment is not open yet. Please pay at the restaurant or call us on +216 73 348 700."],
        back:"Back to the website"}
  }[en?"en":"fr"];
  var m=T[s]||T.ko;
  document.documentElement.lang=en?"en":"fr";
  document.getElementById("t").textContent=m[0];
  document.getElementById("p").innerHTML=m[1];
  document.getElementById("b").textContent=T.back;
  var mk=document.getElementById("mark");
  if(s!=="ok" && s!=="done"){ mk.classList.add("ko"); mk.textContent="!"; }
})();
</script>
</body>
</html>
