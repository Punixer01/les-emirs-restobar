<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Modifier ma réservation — Les Émirs</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bone:#f3efe6;--card:#fffefb;--ink:#17150f;--stone:#6b6456;--mute:#9a9384;--line:#e2dccf;--marine:#1f473f;--gold:#a5822f;--red:#a4452f;--green:#2f7a53;
  --serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;box-shadow:0 20px 60px rgba(24,21,16,.08)}
.mark{font-family:var(--serif);font-size:1.5rem}.mark i{width:7px;height:7px;border-radius:50%;background:var(--marine);display:inline-block;margin-right:7px;vertical-align:middle}
.sub{color:var(--mute);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:6px 0 22px}
h1{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin:0 0 6px}
.res{background:var(--bone);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0;font-size:14px;color:var(--stone)}
.res b{color:var(--ink)}
.fg{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.fg label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fg input,.fg select{padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;font-family:inherit;color:var(--ink)}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--marine)}
.btn{width:100%;padding:15px;background:var(--marine);color:#fff;border:none;border-radius:12px;font-weight:600;font-family:inherit;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.5}
.btn--ghost{background:#fff;color:var(--marine);border:1px solid var(--line)}
.btn--danger{background:#fff;color:var(--red);border:1px solid #e3c4bb}
.btn--danger-solid{background:var(--red);color:#fff;border:none}
.btnrow{display:flex;gap:10px}
.btnrow .btn{width:auto;flex:1}
.hr{height:1px;background:var(--line);margin:22px 0}
.msg{margin-top:14px;font-size:14px;min-height:1.2em;text-align:center}
.note{color:var(--mute);font-size:12px;text-align:center;margin-top:14px}
.center{text-align:center}
a.home{color:var(--marine);font-size:13px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="mark"><i></i>Les Émirs</div>
  <div class="sub">Modifier ma réservation</div>
  <div id="content"><p class="center" style="color:var(--mute)">Chargement…</p></div>
</div>
<script>
(function(){
  "use strict";
  var p=new URLSearchParams(location.search), r=p.get('r'), t=p.get('t');
  var content=document.getElementById('content');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var DOW=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],MON=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  function fdate(d){var x=new Date(d+'T00:00:00');return DOW[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()];}
  function fail(m){content.innerHTML='<p class="center" style="color:var(--red)">'+esc(m)+'</p><p class="center note"><a class="home" href="/">Retour au site</a></p>';}

  if(!r||!t){ fail('Lien invalide.'); return; }
  fetch('/api/reservation-edit?r='+encodeURIComponent(r)+'&t='+encodeURIComponent(t))
    .then(function(res){return res.json();})
    .then(function(d){
      if(d.error){ fail(d.error); return; }
      var v=d.reservation;
      var wantCancel=p.get('annuler')==='1';
      var canCancel=(v.status==='pending'||v.status==='accepted');
      var head='<h1>Bonjour '+esc(v.name)+'</h1><div class="res">Réservation <b>'+esc(v.reference)+'</b><br>'+fdate(v.date)+' · <b>'+esc(v.time)+'</b> · '+v.party+' couverts · '+(v.seating==='terrace'?'Terrasse':'Salle intérieure')+'</div>';

      /* Cancellation is always offered (even after the 3 h edit cutoff), because
         freeing the table late still beats a no-show. Two-step to avoid an
         accidental tap — and email link-prefetch can never cancel a booking. */
      function cancelSection(){
        if(!canCancel) return '';
        return '<div class="hr"></div>'+
          '<p style="color:var(--stone);font-size:13px;margin:0 0 12px">Un empêchement ? Vous pouvez annuler votre réservation.</p>'+
          '<button class="btn btn--danger" id="cancelBtn">Annuler la réservation</button>'+
          '<div id="cancelConfirm" style="display:none;margin-top:12px">'+
            '<p style="color:var(--red);font-size:13px;margin:0 0 10px">Confirmer l’annulation de la réservation <b>'+esc(v.reference)+'</b> ?</p>'+
            '<div class="btnrow"><button class="btn btn--ghost" id="cancelBack">Non, garder</button>'+
            '<button class="btn btn--danger-solid" id="cancelYes">Oui, annuler</button></div>'+
          '</div>'+
          '<div class="msg" id="cmsg"></div>';
      }
      function bindCancel(){
        var cb=document.getElementById('cancelBtn'); if(!cb) return;
        var box=document.getElementById('cancelConfirm'), cmsg=document.getElementById('cmsg');
        cb.addEventListener('click',function(){ cb.style.display='none'; box.style.display='block'; });
        document.getElementById('cancelBack').addEventListener('click',function(){ box.style.display='none'; cb.style.display='block'; });
        document.getElementById('cancelYes').addEventListener('click',function(){
          var y=this; y.disabled=true; cmsg.style.color='var(--stone)'; cmsg.textContent='Annulation…';
          fetch('/api/reservation-edit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({r:r,t:t,cancel:true})})
            .then(function(res){return res.json();})
            .then(function(out){
              if(out.ok&&out.cancelled){
                content.innerHTML='<h1>Réservation annulée</h1><div class="res">Votre réservation <b>'+esc(v.reference)+'</b> a bien été annulée.<br>Le restaurant en est informé.</div><p class="center" style="color:var(--stone);font-size:14px">Au plaisir de vous accueillir une prochaine fois.</p><p class="center note"><a class="home" href="/">Retour au site</a></p>';
              } else { cmsg.style.color='var(--red)'; cmsg.textContent=out.error||'Annulation impossible.'; y.disabled=false; }
            })
            .catch(function(){ cmsg.style.color='var(--red)'; cmsg.textContent='Erreur réseau.'; y.disabled=false; });
        });
        if(wantCancel){ cb.click(); box.scrollIntoView({behavior:'smooth',block:'center'}); }
      }

      if(!d.editable){
        content.innerHTML=head+'<p style="color:var(--stone);font-size:13px">'+esc(d.reason||'Modification indisponible.')+'</p>'+cancelSection()+(canCancel?'':'<p class="center note"><a class="home" href="/">Retour au site</a></p>');
        bindCancel(); return;
      }
      /* same window the booking form offers, so a guest can never pick an
         hour the restaurant does not take */
      var hopts='';
      for(var m=12*60;m<=21*60+30;m+=30){
        var hh=String(Math.floor(m/60)).padStart(2,'0'), mm=String(m%60).padStart(2,'0'), val=hh+':'+mm;
        hopts+='<option value="'+val+'"'+(val===v.time?' selected':'')+'>'+hh+'h'+mm+'</option>';
      }
      var popts='';
      for(var np=1;np<=20;np++){ popts+='<option value="'+np+'"'+(np===Number(v.party)?' selected':'')+'>'+np+' couvert'+(np>1?'s':'')+'</option>'; }
      content.innerHTML=head+
        '<p style="color:var(--stone);font-size:13px;margin:0 0 16px">Vous pouvez modifier l’heure, la place et le nombre de couverts (jusqu’à 3 h avant). Toute modification est renvoyée au restaurant pour confirmation.</p>'+
        '<div class="fg"><label for="time">Heure</label><select id="time">'+hopts+'</select></div>'+
        '<div class="fg"><label for="party">Nombre de couverts</label><select id="party">'+popts+
          '<option value="__more"'+(Number(v.party)>20?' selected':'')+'>Plus de 20 — nous appeler</option></select></div>'+
        '<div class="fg"><label for="seating">Place</label><select id="seating">'+
          '<option value="terrace"'+(v.seating==='terrace'?' selected':'')+'>Terrasse</option>'+
          '<option value="inside"'+(v.seating!=='terrace'?' selected':'')+'>Salle intérieure</option></select></div>'+
        '<button class="btn" id="save">Enregistrer les modifications</button>'+
        '<div class="msg" id="msg"></div>'+
        cancelSection();
      bindCancel();
      document.getElementById('save').addEventListener('click',function(){
        var btn=this,msg=document.getElementById('msg');
        var pv=document.getElementById('party').value;
        if(pv==='__more'){ msg.style.color='var(--red)'; msg.textContent='Pour plus de 20 couverts, merci de nous appeler.'; return; }
        btn.disabled=true; msg.style.color='var(--stone)'; msg.textContent='Enregistrement…';
        fetch('/api/reservation-edit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({r:r,t:t,time:document.getElementById('time').value,seating:document.getElementById('seating').value,party:+pv})})
          .then(function(res){return res.json();})
          .then(function(out){
            if(out.ok){
              var w=out.reservation;
              msg.style.color='var(--green)';
              msg.innerHTML='✔ C’est noté : <b>'+esc(w.time)+'</b> · '+w.party+' couverts · '+(w.seating==='terrace'?'Terrasse':'Salle intérieure')+'.<br>'+(out.review?'Votre demande est envoyée au restaurant pour confirmation.':'Le restaurant est prévenu.');
              btn.disabled=false;
            } else { msg.style.color='var(--red)'; msg.textContent=out.error||'Modification impossible.'; btn.disabled=false; }
          })
          .catch(function(){ msg.style.color='var(--red)'; msg.textContent='Erreur réseau.'; btn.disabled=false; });
      });
    })
    .catch(function(){ fail('Lien invalide ou expiré.'); });
})();
</script>
</body>
</html>
